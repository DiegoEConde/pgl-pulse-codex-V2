<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">PGL Pulse v2 - Diagrama simplificado de base de datos</title>
  <desc id="desc">Diagrama conceptual con trece tablas iniciales: usuarios, clientes, proveedores, productos, compras, compra_items, ventas, venta_items, unidades, rutas, ruta_items, movimientos_dinero e historial_eventos.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#ffffff;stroke:#334155;stroke-width:2}.core{fill:#eef6ff}.money{fill:#fff7e8}.route{fill:#edf8ed}.audit{fill:#f6f6f6}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.label{font:700 19px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#334155}.line{stroke:#64748b;stroke-width:2;fill:none}.note{font:16px Arial,sans-serif;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="50" y="48">PGL Pulse v2 - Base simplificada</text>
  <text class="note" x="50" y="76">Modelo inicial local: menos tablas, misma trazabilidad operativa esencial.</text>

  <rect class="box core" x="70" y="125" width="210" height="88" rx="10"/>
  <text class="label" x="95" y="160">usuarios</text>
  <text class="small" x="95" y="184">roles, comision, reparto</text>

  <rect class="box core" x="70" y="255" width="210" height="88" rx="10"/>
  <text class="label" x="95" y="290">clientes</text>
  <text class="small" x="95" y="314">ventas y deuda</text>

  <rect class="box core" x="70" y="385" width="210" height="88" rx="10"/>
  <text class="label" x="95" y="420">proveedores</text>
  <text class="small" x="95" y="444">compras y pagos</text>

  <rect class="box core" x="70" y="515" width="210" height="88" rx="10"/>
  <text class="label" x="95" y="550">productos</text>
  <text class="small" x="95" y="574">catalogo + atributos</text>

  <rect class="box" x="390" y="220" width="220" height="96" rx="10"/>
  <text class="label" x="420" y="255">ventas</text>
  <text class="small" x="420" y="279">cliente, vendedor,</text>
  <text class="small" x="420" y="298">comprobante snapshot</text>

  <rect class="box" x="710" y="220" width="220" height="96" rx="10"/>
  <text class="label" x="740" y="255">venta_items</text>
  <text class="small" x="740" y="279">producto vendido</text>
  <text class="small" x="740" y="298">pago/entrega por unidad</text>

  <rect class="box" x="390" y="420" width="220" height="96" rx="10"/>
  <text class="label" x="420" y="455">compras</text>
  <text class="small" x="420" y="479">proveedor y retiro</text>

  <rect class="box" x="710" y="420" width="220" height="96" rx="10"/>
  <text class="label" x="740" y="455">compra_items</text>
  <text class="small" x="740" y="479">pedido individual</text>
  <text class="small" x="740" y="498">abastece venta o stock</text>

  <rect class="box" x="1050" y="320" width="220" height="110" rx="10"/>
  <text class="label" x="1080" y="355">unidades</text>
  <text class="small" x="1080" y="379">IMEI, estado, ubicacion</text>
  <text class="small" x="1080" y="398">garantia como estado</text>

  <rect class="box route" x="390" y="650" width="220" height="96" rx="10"/>
  <text class="label" x="420" y="685">rutas</text>
  <text class="small" x="420" y="709">repartidor y fecha</text>

  <rect class="box route" x="710" y="650" width="220" height="96" rx="10"/>
  <text class="label" x="740" y="685">ruta_items</text>
  <text class="small" x="740" y="709">retirar, pagar,</text>
  <text class="small" x="740" y="728">entregar, cobrar</text>

  <rect class="box money" x="1050" y="610" width="260" height="112" rx="10"/>
  <text class="label" x="1080" y="645">movimientos_dinero</text>
  <text class="small" x="1080" y="669">cobros, pagos, caja,</text>
  <text class="small" x="1080" y="688">rendiciones y cierres</text>

  <rect class="box audit" x="1050" y="800" width="260" height="96" rx="10"/>
  <text class="label" x="1080" y="835">historial_eventos</text>
  <text class="small" x="1080" y="859">auditoria y cambios</text>

  <path class="line" marker-end="url(#arrow)" d="M280 299 H390"/>
  <path class="line" marker-end="url(#arrow)" d="M280 429 H390"/>
  <path class="line" marker-end="url(#arrow)" d="M280 559 C470 559 520 516 710 468"/>
  <path class="line" marker-end="url(#arrow)" d="M280 559 C480 559 520 316 710 268"/>
  <path class="line" marker-end="url(#arrow)" d="M610 268 H710"/>
  <path class="line" marker-end="url(#arrow)" d="M610 468 H710"/>
  <path class="line" marker-end="url(#arrow)" d="M930 268 C995 285 1015 320 1050 360"/>
  <path class="line" marker-end="url(#arrow)" d="M930 468 C995 448 1015 420 1050 390"/>
  <path class="line" marker-end="url(#arrow)" d="M610 698 H710"/>
  <path class="line" marker-end="url(#arrow)" d="M930 698 H1050"/>
  <path class="line" marker-end="url(#arrow)" d="M930 698 C1000 620 1000 450 1050 390"/>
  <path class="line" marker-end="url(#arrow)" d="M930 268 C1010 330 1040 545 1050 650"/>
  <path class="line" marker-end="url(#arrow)" d="M930 468 C1010 520 1040 590 1050 660"/>
  <path class="line" marker-end="url(#arrow)" d="M1180 722 V800"/>
  <path class="line" marker-end="url(#arrow)" d="M1160 430 V800"/>
  <path class="line" marker-end="url(#arrow)" d="M280 169 C520 120 830 135 1050 330"/>

  <text class="note" x="70" y="930">Comprobantes: campos y snapshot dentro de ventas. Garantia: estado de unidades. Caja y cierres: movimientos_dinero.</text>
</svg>